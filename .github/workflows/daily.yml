name: daily
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .github/heartbeat
          git config user.name naphatphong
          git config user.email naphatphong.n@kkumail.com
          git commit -am "Daily heartbeat $(date -u +%F)"
          git push
