name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Unit tests and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  database:
    name: Migrations, RLS and SQL tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostGIS and pgRouting
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-16-postgis-3 postgresql-16-pgrouting
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          createdb "$USER"
      - run: supabase/tests/run-local.sh
